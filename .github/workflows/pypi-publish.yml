name: Publish Python package to PyPI

# Triggered on any v*.* / v*.*.* tag push (matches the existing
# docker-publish workflow's trigger). Also runnable manually for the
# rare case where you want to republish without bumping a tag.
on:
  push:
    tags:
      - "v*.*"
      - "v*.*.*"
  workflow_dispatch:

# One-time setup before this can publish successfully:
#
#   1. Create the PyPI project page (or rely on PyPI's
#      "pending publisher" feature, which creates the project
#      automatically on the first successful publish).
#
#   2. Log in to https://pypi.org/manage/account/publishing/ and
#      add a new trusted publisher with EXACTLY these fields:
#
#         PyPI project name : pdf-a11y
#         Owner             : adamopoulosa1980
#         Repository name   : pdf_accessibility
#         Workflow filename : pypi-publish.yml
#         Environment name  : pypi
#
#      That binds this specific workflow file in this specific repo to
#      the PyPI project via OpenID Connect - no API token in GitHub
#      secrets, no expiry, no manual rotation. PyPI mints a short-lived
#      upload token on every workflow run.
#
#   3. Push a v2.10.0 tag. This workflow runs and publishes the first
#      release.

jobs:
  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build front-end
        run: python -m pip install --upgrade pip build

      - name: Build wheel + sdist
        run: python -m build

      - name: Show what we built
        run: ls -la dist/

      - name: Upload build artefacts for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    # The `pypi` environment binds the OIDC token to a specific
    # trusted-publisher slot on PyPI; matches the "Environment name"
    # configured at https://pypi.org/manage/account/publishing/.
    environment:
      name: pypi
      url: https://pypi.org/project/pdf-a11y/

    # `id-token: write` is what lets the runner mint an OIDC token
    # for PyPI - without it the publish step errors with
    # "Trusted publisher: no OIDC token returned".
    permissions:
      id-token: write

    steps:
      - name: Download the dists built by the previous job
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI via trusted publishing (OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        # No `password:` field - the action auto-detects OIDC when
        # `id-token: write` is granted and an environment exists.
